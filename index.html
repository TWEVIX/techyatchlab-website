<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechYatch Lab™ | Proprietary Data Science &amp; AI Simulation Platform</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <meta name="description" content="TechYatch Lab™ replaces passive video courses with browser-based Python & Streamlit operational simulations and SHA-256 verified competency credentials." />
  <style>
    :root {
      --bg-midnight: #05111e;
      --bg-navy-card: #0b1d32;
      --bg-navy-elevated: #102844;
      --emerald-bright: #10b981;
      --emerald-glow: #34d399;
      --emerald-dark: #059669;
      --teal-logo: #0d9488;
      --amber-gold: #f59e0b;
      --amber-dark: #d97706;
      --text-white: #f8fafc;
      --text-slate: #cbd5e1;
      --text-muted: #94a3b8;
      --border-glow: rgba(16, 185, 129, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg-midnight);
      color: var(--text-white);
      line-height: 1.65;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }

    /* Keyframe Animations */
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Navigation */
    header {
      background: rgba(5, 17, 30, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 1rem 4%;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-inner {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: 0.85rem; }
    .brand img {
      height: 48px;
      width: auto;
      border-radius: 10px;
      border: 1.5px solid var(--emerald-bright);
      background: #ffffff;
      transition: transform 0.25s ease;
    }
    .brand:hover img { transform: rotate(-3deg) scale(1.05); }
    .brand-name { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-name span { color: var(--emerald-glow); }
    .brand-tag { font-size: 0.8rem; color: var(--text-muted); }

    nav { display: flex; gap: 1.75rem; align-items: center; font-size: 0.95rem; font-weight: 600; }
    nav a { color: var(--text-slate); transition: color 0.2s; }
    nav a:hover { color: var(--emerald-glow); }
    .nav-btn {
      background: linear-gradient(135deg, var(--emerald-bright), var(--teal-logo));
      color: #ffffff !important;
      padding: 0.65rem 1.35rem;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .nav-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(16, 185, 129, 0.5); }

    /* Expansive Animated Hero */
    .hero {
      background: linear-gradient(-45deg, #05111e, #082338, #061c2c, #0a2e38);
      background-size: 300% 300%;
      animation: bgShift 14s ease infinite;
      padding: 5.5rem 4% 6rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .hero-grid {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 4rem;
      align-items: center;
    }
    @media (max-width: 960px) {
      .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }
    }
    .kicker {
      display: inline-block;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid var(--border-glow);
      color: var(--emerald-glow);
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.35rem;
    }
    .hero h1 {
      font-size: clamp(2.3rem, 4.3vw, 3.65rem);
      font-weight: 850;
      line-height: 1.13;
      margin-bottom: 1.35rem;
    }
    .hero h1 span { color: var(--emerald-glow); display: block; }
    .hero p {
      font-size: 1.14rem;
      color: var(--text-slate);
      margin-bottom: 2.3rem;
      max-width: 660px;
    }
    .cta-group { display: flex; gap: 1rem; flex-wrap: wrap; }
    .btn {
      padding: 0.95rem 1.7rem;
      border-radius: 0.65rem;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.22s ease;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald-bright), var(--emerald-dark));
      color: #ffffff;
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
    }
    .btn-amber {
      background: linear-gradient(135deg, var(--amber-gold), var(--amber-dark));
      color: #05111e;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-white);
      border: 1px solid var(--border-subtle);
    }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--emerald-glow); }

    /* Floating Interactive Mini-Sandbox Card */
    .sandbox-preview {
      background: rgba(11, 29, 50, 0.92);
      border: 1.5px solid var(--border-glow);
      border-radius: 1.35rem;
      padding: 2.25rem;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.55);
      animation: floatCard 5s ease-in-out infinite;
    }
    .preview-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.3rem;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .preview-top img {
      height: 74px;
      border-radius: 14px;
      background: #ffffff;
      padding: 4px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald-glow);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald-glow);
      animation: pulseDot 1.8s infinite;
    }
    .slider-box {
      background: var(--bg-navy-elevated);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 0.9rem;
      padding: 1.25rem;
      margin: 1.15rem 0;
    }
    .slider-box label {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.65rem;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--amber-gold);
      cursor: pointer;
    }
    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.1rem;
    }
    .kpi {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--border-glow);
      border-radius: 0.85rem;
      padding: 1rem;
      text-align: center;
      transition: transform 0.2s ease;
    }
    .kpi:hover { transform: scale(1.03); }
    .kpi span { display: block; font-size: 0.8rem; color: var(--text-slate); font-weight: 600; }
    .kpi strong { font-size: 1.5rem; color: var(--emerald-glow); }

    /* Wide Metrics Strip */
    .metrics {
      max-width: 1360px;
      margin: -2.2rem auto 4rem;
      padding: 0 4%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      position: relative;
      z-index: 10;
    }
    .metric-card {
      background: var(--bg-navy-card);
      border: 1px solid var(--border-glow);
      border-radius: 0.9rem;
      padding: 1.65rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease;
    }
    .metric-card:hover { transform: translateY(-4px); }
    .metric-card h3 { font-size: 1.2rem; color: var(--emerald-glow); margin-bottom: 0.35rem; }
    .metric-card p { font-size: 0.92rem; color: var(--text-slate); }

    /* Sections */
    .section { max-width: 1360px; margin: 0 auto; padding: 4.5rem 4%; }
    .section-head { text-align: center; max-width: 780px; margin: 0 auto 3.25rem; }
    .sec-tag {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--emerald-glow);
      margin-bottom: 0.5rem;
    }
    .section-head h2 { font-size: 2.35rem; font-weight: 850; margin-bottom: 0.75rem; }
    .section-head p { color: var(--text-slate); font-size: 1.08rem; }

    /* 5 Simulations Grid */
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.75rem;
    }
    .case-card {
      background: var(--bg-navy-card);
      border: 1px solid var(--border-subtle);
      border-radius: 1.1rem;
      padding: 2rem;
      transition: all 0.25s ease;
    }
    .case-card:hover {
      border-color: var(--emerald-bright);
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(16, 185, 129, 0.16);
    }
    .tag-free {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-glow);
      border: 1px solid var(--border-glow);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.85rem;
    }
